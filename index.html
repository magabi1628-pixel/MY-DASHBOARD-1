<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard 🌸</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff9fb;color:#222;min-height:100vh;padding:1.5rem}
.wrap{max-width:960px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:10px}
h1{font-size:22px;font-weight:700;color:#ED0C7D;display:flex;align-items:center;gap:8px}
.greeting{font-size:12px;color:#888;margin-top:2px}
.date-badge{font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;background:#FFE3F4;color:#A3005A}
.btn-sync{font-size:12px;font-weight:600;padding:6px 14px;border-radius:20px;background:#23DBCD;color:#004D40;border:none;cursor:pointer;display:flex;align-items:center;gap:5px}
.btn-sync:hover{opacity:.85}
.btn-new-day{font-size:12px;font-weight:600;padding:6px 14px;border-radius:20px;background:#ED0C7D;color:#fff;border:none;cursor:pointer}
.loading{text-align:center;padding:3rem;color:#ED0C7D;font-size:14px}
.error-box{background:#FFF5F8;border:1px solid #FE9BD4;border-radius:12px;padding:1rem;margin-bottom:1rem;font-size:13px;color:#A3005A}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:1.25rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.25rem}
@media(max-width:700px){.grid4{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #f0e0ea;border-radius:14px;padding:1rem 1.25rem}
.metric{border-radius:10px;padding:1rem;text-align:center}
.m-label{font-size:11px;margin-bottom:5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.m-val{font-size:24px;font-weight:700}
.m-sub{font-size:11px;margin-top:3px;opacity:.8}
.card-title{font-size:13px;font-weight:600;color:#888;margin-bottom:.875rem;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.task-list{display:flex;flex-direction:column;gap:6px}
.task-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13px;border:1px solid #fce8f3}
.task-item.done{opacity:.5;text-decoration:line-through}
.task-check{width:18px;height:18px;border-radius:50%;border:1.5px solid #ddd;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;transition:all .15s;cursor:pointer}
.task-check.ok{border-color:#ED0C7D;background:#ED0C7D;color:#fff}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;flex-shrink:0;font-weight:600;margin-left:auto}
.task-mins{font-size:10px;color:#aaa;flex-shrink:0}
.p-bar-bg{height:7px;background:#f5e6f0;border-radius:4px;overflow:hidden;margin-top:4px}
.p-bar{height:7px;border-radius:4px;transition:width .8s;background:#ED0C7D}
.prog-section{display:flex;flex-direction:column;gap:8px}
.p-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.tiempo-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #fce8f3}
.tiempo-row:last-child{border-bottom:none}
.t-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.t-name{font-size:13px;flex:1}
.t-h{font-size:13px;font-weight:600}
.t-pct{font-size:11px;color:#aaa;min-width:30px;text-align:right}
.wf-step{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:10px;margin-bottom:4px}
.wf-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}
.wf-body{flex:1}
.wf-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wf-acts{font-size:11px;color:#888;margin-top:2px;line-height:1.5}
.wf-badge{font-size:10px;padding:1px 7px;border-radius:20px;font-weight:600}
.cal-event{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:#E8FDF9;margin-bottom:5px;font-size:12px}
.cal-time{color:#00897C;font-weight:600;min-width:40px}
.cal-title{flex:1;color:#005048}
.cal-dur{color:#aaa;font-size:11px}
.history-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #fce8f3;font-size:12px}
.history-row:last-child{border-bottom:none}
.history-date{color:#aaa;min-width:80px}
.history-pct{font-weight:700;min-width:40px;text-align:right}
.recuento-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #fce8f3;font-size:13px}
.recuento-row:last-child{border-bottom:none}
.pom-wrap{display:flex;align-items:center;gap:1rem}
.pom-ring{width:72px;height:72px;flex-shrink:0}
.pom-time{font-size:20px;font-weight:700}
.pom-mode{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;display:inline-block;margin-bottom:2px}
.pom-btns{display:flex;gap:6px;margin-top:4px}
.pom-btns button{font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid #ED0C7D;color:#ED0C7D;background:transparent;cursor:pointer}
.tabs{display:flex;margin-bottom:.85rem;border:1px solid #f0e0ea;border-radius:8px;overflow:hidden}
.tab{flex:1;text-align:center;font-size:12px;padding:5px 0;cursor:pointer;color:#aaa;background:transparent;border:none}
.tab.active{background:#FE9BD4;color:#7A0040;font-weight:600}
.chart-wrap{width:100%}
.legend-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:.5rem}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#888}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.toast{position:fixed;bottom:20px;right:20px;background:#23DBCD;color:#004D40;font-size:13px;font-weight:600;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none}
.toast.show{opacity:1}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:50;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border:1px solid #f0e0ea;border-radius:14px;padding:1.25rem;width:340px}
.modal h3{font-size:14px;font-weight:600;margin-bottom:1rem}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.summary-box{background:#fff9fb;border:1px solid #fce8f3;border-radius:10px;padding:.75rem .5rem;text-align:center}
.summary-box .val{font-size:20px;font-weight:700;color:#ED0C7D}
.summary-box .lbl{font-size:10px;color:#aaa;margin-top:2px}
.pal-strip{display:flex;gap:5px;flex-wrap:wrap}
.pal-sw{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s}
.pal-sw:hover{transform:scale(1.15)}
.pal-sw.active{border-color:#333;transform:scale(1.15)}
.sync-status{font-size:11px;color:#aaa;text-align:right;margin-bottom:.5rem}
</style>
</head>
<body>
<div class="wrap" id="main-wrap">

<div class="header">
  <div>
    <h1>🌸 My Dashboard</h1>
    <div class="greeting" id="greeting">Cargando...</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <div class="pal-strip" id="pal-strip">
      <div class="pal-sw active" style="background:#ED0C7D" onclick="applyPal(0)"></div>
      <div class="pal-sw" style="background:#FE9D18" onclick="applyPal(1)"></div>
      <div class="pal-sw" style="background:#23DBCD" onclick="applyPal(2)"></div>
      <div class="pal-sw" style="background:#F154B0" onclick="applyPal(3)"></div>
      <div class="pal-sw" style="background:#00897C" onclick="applyPal(4)"></div>
    </div>
    <div class="date-badge" id="date-badge">—</div>
    <button class="btn-sync" onclick="loadData()">🔄 Sync</button>
    <button class="btn-new-day" onclick="openNewDay()">🌅 Nuevo día</button>
  </div>
</div>

<div class="sync-status" id="sync-status">Conectando con Google Sheets...</div>
<div id="error-container"></div>
<div id="dashboard-content"><div class="loading">🌸 Cargando datos desde Google Sheets...</div></div>

</div>

<div id="toast" class="toast"></div>

<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal" id="modal-inner" onclick="event.stopPropagation()"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
var API_URL = 'https://script.google.com/a/macros/ladimensions.com/s/AKfycbxkklSiZjxj4Lfam_Wtc2wkvnjlQy7arhmvazL_Lj-TbP2KgjVSY96yWiOCW1rgJ12K8A/exec';
var TOKEN = 'MECHUDITA1628';
var curAcc = '#ED0C7D';
var palHex = ['#ED0C7D','#FE9D18','#23DBCD','#F154B0','#00897C'];
var catColors = {Comunicación:'#F154B0',Operaciones:'#ED0C7D',Análisis:'#FE9D18',Logística:'#8E24AA',Clientes:'#23DBCD'};
var catBg = {Comunicación:'#FFE3F4',Operaciones:'#FE9BD4',Análisis:'#FFE2CF',Logística:'#E1BEE7',Clientes:'#B7EDE4'};
var catTc = {Comunicación:'#A3005A',Operaciones:'#7A0040',Análisis:'#8B4000',Logística:'#4A148C',Clientes:'#005048'};
var chart0=null,chart1=null,chart2=null;
var pomWork=25,pomBreak=5,pomSessions=4,pomRunning=false,pomInterval=null,pomSec=25*60,pomCurSess=1,pomIsWork=true,circ=188.5;
var dashData = null;

function applyPal(i){
  document.querySelectorAll('.pal-sw').forEach((s,j)=>s.classList.toggle('active',i===j));
  curAcc=palHex[i];
  localStorage.setItem('db_pal',i);
  if(dashData) renderDashboard(dashData);
}

function showToast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function initHeader(){
  var now=new Date();
  var h=now.getHours();
  var greetings=['🌙 Buenas noches, Gaby','🌙 Buenas noches, Gaby','🌙 Buenas noches, Gaby','🌙 Buenas noches, Gaby','🌙 Buenas noches, Gaby',
    '🌸 Buenos días — bloque tranquilo hasta las 11am','🌸 Buenos días — arranca con emails y Slack',
    '🌸 Buenos días — revisa pendientes de ayer','🌸 Buenos días — revisa pendientes de ayer',
    '🌸 Buenos días — queda poco para el punto de activación','🌸 Buenos días — queda poco para el punto de activación',
    '⚡ Punto de activación — revisa leads urgentes','🔥 Análisis → Operaciones — Area Analysis primero',
    '🔥 Modo operaciones — procesa los quotes','🍽 Pausa + Deliveries','🔥 Modo caos productivo',
    '🔥 Modo caos productivo — Customer Excellence y Follow Up','🔥 Modo caos productivo',
    '🌆 Cierre del día — revisa emails y Slack','🌙 Cierre del día — anota pendientes para mañana',
    '🌙 Hora de cerrar — buen trabajo hoy','🌙 Descansa — mañana más','🌙 Buenas noches, Gaby','🌙 Buenas noches, Gaby'];
  document.getElementById('greeting').textContent=greetings[h];
  var days=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var d=new Date();
  document.getElementById('date-badge').textContent=days[d.getDay()]+', '+d.getDate()+' de '+months[d.getMonth()];
}

async function loadData(){
  document.getElementById('sync-status').textContent='🔄 Sincronizando con Google Sheets...';
  document.getElementById('error-container').innerHTML='';
  try {
    var url=API_URL+'?token='+TOKEN+'&action=getData';
    var res=await fetch(url);
    var data=await res.json();
    if(data.error){throw new Error(data.error);}
    dashData=data;
    renderDashboard(data);
    document.getElementById('sync-status').textContent='✅ Sincronizado · '+new Date().toLocaleTimeString('es-CO');
    showToast('✅ Datos actualizados desde Sheets');
  } catch(err){
    document.getElementById('sync-status').textContent='❌ Error de conexión';
    document.getElementById('error-container').innerHTML=`<div class="error-box">❌ No se pudo conectar con Google Sheets: ${err.message}<br><small>Verifica que el Apps Script esté deployado correctamente.</small></div>`;
    loadLocal();
  }
}

function loadLocal(){
  var state=localStorage.getItem('db_state');
  if(state){
    dashData=JSON.parse(state);
    renderDashboard(dashData);
    document.getElementById('sync-status').textContent='⚠️ Mostrando datos locales (sin conexión)';
  }
}

async function updateTask(name, done){
  try {
    await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:TOKEN,action:'updateTask',name,done})
    });
  } catch(e){ console.log('Update error:',e); }
}

async function saveHistoryToSheets(data){
  try {
    await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:TOKEN,action:'saveHistory',data})
    });
  } catch(e){ console.log('History error:',e); }
}

function renderDashboard(data){
  var tasks=data.tasks||[];
  var events=data.events||[];
  var history=data.history||[];
  localStorage.setItem('db_state',JSON.stringify(data));

  var done=tasks.filter(t=>t.done).length;
  var total=tasks.length;
  var pct=total?Math.round(done/total*100):0;
  var doneMins=tasks.filter(t=>t.done).reduce((a,t)=>a+(t.mins||0),0);
  var totalMins=tasks.reduce((a,t)=>a+(t.mins||0),0);
  var groupMins={},groupDone={},groupPend={};
  tasks.forEach(t=>{
    var g=t.cat||'Otros';
    if(!groupMins[g])groupMins[g]=0; groupMins[g]+=(t.mins||0);
    if(t.done){if(!groupDone[g])groupDone[g]=0;groupDone[g]++;}
    else{if(!groupPend[g])groupPend[g]=0;groupPend[g]+=(t.mins||0);}
  });
  var topGroup=Object.keys(groupDone).sort((a,b)=>(groupDone[b]||0)-(groupDone[a]||0))[0]||'—';
  var streak=0;
  for(var k=history.length-1;k>=0;k--){if(Number(history[k].pct)>=50)streak++;else break;}

  var html='';

  // Métricas
  html+=`<div class="grid4">
    <div class="metric" style="background:#FFE3F4"><div class="m-label" style="color:#A3005A">✓ Completadas</div><div class="m-val" style="color:#ED0C7D">${done} / ${total}</div><div class="m-sub" style="color:#C2006E">${pct}% del día</div></div>
    <div class="metric" style="background:#FFE2CF"><div class="m-label" style="color:#8B4000">⏱ Tiempo</div><div class="m-val" style="color:#FE9D18">${(doneMins/60).toFixed(1)} h</div><div class="m-sub" style="color:#A05000">meta: 8 h</div></div>
    <div class="metric" style="background:#B7EDE4"><div class="m-label" style="color:#005048">📊 Productividad</div><div class="m-val" style="color:#00897C">${pct}%</div><div class="m-sub" style="color:#006B60">actividades listas</div></div>
    <div class="metric" style="background:#FE9BD4"><div class="m-label" style="color:#7A0040">🔥 Racha</div><div class="m-val" style="color:#ED0C7D">${streak}</div><div class="m-sub" style="color:#A3005A">días seguidos</div></div>
  </div>`;

  // Barra progreso
  html+=`<div class="card" style="margin-bottom:1.25rem;padding:.75rem 1.25rem">
    <div style="font-size:11px;color:#aaa;margin-bottom:6px">PROGRESO DEL DÍA — ${pct}% completado</div>
    <div class="p-bar-bg" style="height:10px"><div class="p-bar" style="width:${pct}%;background:${curAcc};height:10px"></div></div>
  </div>`;

  // Grid 2 columnas
  html+='<div class="grid2">';

  // Tareas
  html+=`<div class="card">
    <div class="card-title"><i class="ti ti-list-check" style="color:${curAcc}"></i> Actividades del día</div>
    <div class="task-list" id="task-list">`;
  tasks.forEach((t,i)=>{
    var bg=catBg[t.cat]||'#fff9fb';var tc=catTc[t.cat]||'#666';var cc=catColors[t.cat]||'#888';
    html+=`<div class="task-item${t.done?' done':''}" style="background:${bg}" data-idx="${i}">
      <div class="task-check${t.done?' ok':''}" onclick="toggleTask(${i})">${t.done?'✓':''}</div>
      <span style="font-size:13px;flex:1;color:${t.done?'#aaa':'#333'}">${t.name}</span>
      <span class="task-mins">${t.mins} min</span>
      <span class="tag" style="background:${bg};color:${tc};border:1px solid ${cc}">${t.cat}</span>
    </div>`;
  });
  html+=`</div></div>`;

  // Columna derecha
  html+='<div style="display:flex;flex-direction:column;gap:12px">';

  // Workflow
  html+=`<div class="card">
    <div class="card-title"><i class="ti ti-route" style="color:${curAcc}"></i> Workflow del día</div>
    <div class="wf-step" style="background:#FFF5F8"><div class="wf-num" style="background:#FFE3F4;color:#A3005A">1</div><div class="wf-body"><div class="wf-title">Setup & Admin <span class="wf-badge" style="background:#FFE3F4;color:#A3005A">8–11am</span></div><div class="wf-acts">Email · Slack · Invoices · Airtable</div></div></div>
    <div class="wf-step" style="background:#FFE3F4"><div class="wf-num" style="background:#ED0C7D;color:#fff">!</div><div class="wf-body"><div class="wf-title" style="color:#A3005A">Punto de activación <span class="wf-badge" style="background:#ED0C7D;color:#fff">11am</span></div><div class="wf-acts" style="color:#A3005A">El ritmo sube — llegan leads</div></div></div>
    <div class="wf-step" style="background:#FFF2CF"><div class="wf-num" style="background:#FFE2CF;color:#8B4000">2</div><div class="wf-body"><div class="wf-title">Análisis → Operaciones <span class="wf-badge" style="background:#FFE2CF;color:#8B4000">11–1pm</span></div><div class="wf-acts">Area Analysis · Quoting · Leading</div></div></div>
    <div class="wf-step" style="background:#F9F5FF"><div class="wf-num" style="background:#E1BEE7;color:#4A148C">3</div><div class="wf-body"><div class="wf-title">Pausa + Logística <span class="wf-badge" style="background:#E1BEE7;color:#4A148C">1–2pm</span></div><div class="wf-acts">Deliveries · confirmar entregas</div></div></div>
    <div class="wf-step" style="background:#FFF0F7"><div class="wf-num" style="background:#ED0C7D;color:#fff">🔥</div><div class="wf-body"><div class="wf-title" style="color:#7A0040">Modo caos productivo <span class="wf-badge" style="background:#ED0C7D;color:#fff">2–5pm</span></div><div class="wf-acts" style="color:#A3005A">Customer Excellence · Follow Up · Quoting</div></div></div>
    <div class="wf-step" style="background:#F0FDFB"><div class="wf-num" style="background:#B7EDE4;color:#005048">4</div><div class="wf-body"><div class="wf-title">Cierre del día <span class="wf-badge" style="background:#B7EDE4;color:#005048">5–6pm</span></div><div class="wf-acts">Email · Slack · Airtable · pendientes</div></div></div>
  </div>`;

  // Pomodoro
  html+=`<div class="card">
    <div class="card-title"><i class="ti ti-tomato" style="color:#FE9D18"></i> Pomodoro</div>
    <div class="pom-wrap">
      <svg class="pom-ring" viewBox="0 0 72 72">
        <circle cx="36" cy="36" r="30" fill="none" stroke="#FFE3F4" stroke-width="7"/>
        <circle id="pom-arc" cx="36" cy="36" r="30" fill="none" stroke="${curAcc}" stroke-width="7" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="0" transform="rotate(-90 36 36)"/>
      </svg>
      <div style="display:flex;flex-direction:column;gap:6px;flex:1">
        <span class="pom-mode" id="pom-badge" style="background:#FFE3F4;color:#A3005A">Trabajo</span>
        <div class="pom-time" id="pom-display">25:00</div>
        <div style="font-size:11px;color:#aaa" id="pom-sess">Sesión 1 de 4</div>
        <div class="pom-btns">
          <button id="pom-btn" onclick="pomToggle()">▶ Iniciar</button>
          <button onclick="pomReset()">↺</button>
        </div>
      </div>
    </div>
  </div>`;

  // Tiempo por grupo
  html+=`<div class="card">
    <div class="card-title"><i class="ti ti-clock-hour-4" style="color:#23DBCD"></i> Tiempo por grupo</div>`;
  Object.keys(groupMins).forEach(g=>{
    var pctG=totalMins?Math.round(groupMins[g]/totalMins*100):0;
    html+=`<div class="tiempo-row">
      <div class="t-dot" style="background:${catColors[g]||'#888'}"></div>
      <span class="t-name">${g}</span>
      <span class="t-h">${(groupMins[g]/60).toFixed(1)} h</span>
      <span class="t-pct">${pctG}%</span>
    </div>`;
  });
  html+=`</div>`;

  // Calendar
  var todayStr=new Date().toISOString().slice(0,10);
  var todayEvs=events.filter(e=>e.date&&e.date.toString().slice(0,10)===todayStr);
  html+=`<div class="card">
    <div class="card-title"><i class="ti ti-calendar" style="color:#23DBCD"></i> Google Calendar — hoy</div>`;
  if(todayEvs.length===0){
    html+=`<div style="font-size:12px;color:#ccc;font-style:italic">Sin eventos hoy. Usa el menú 🌸 en Sheets → Sync Calendar</div>`;
  } else {
    todayEvs.forEach(ev=>{
      html+=`<div class="cal-event">
        <span class="cal-time">${ev.start||''}</span>
        <span class="cal-title">${ev.title}</span>
        <span class="cal-dur">${ev.duration||''}</span>
      </div>`;
    });
  }
  html+=`</div>`;

  html+='</div></div>';

  // Gráficas
  html+=`<div class="card" style="margin-bottom:1.25rem">
    <div class="card-title"><i class="ti ti-chart-dots" style="color:${curAcc}"></i> Análisis de tiempo</div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab(0)">Por actividad</button>
      <button class="tab" onclick="switchTab(1)">Por grupo</button>
      <button class="tab" onclick="switchTab(2)">Semana</button>
    </div>
    <div id="cp0" class="chart-wrap"><canvas id="chart0" height="180"></canvas></div>
    <div id="cp1" class="chart-wrap" style="display:none"><canvas id="chart1" height="180"></canvas><div class="legend-row" id="donut-legend"></div></div>
    <div id="cp2" class="chart-wrap" style="display:none"><canvas id="chart2" height="180"></canvas></div>
  </div>`;

  // Resumen inferior
  html+=`<div class="grid3">
    <div class="card">
      <div class="card-title"><i class="ti ti-stopwatch" style="color:#FE9D18"></i> Mayor tiempo</div>
      <div id="top-tasks" style="display:flex;flex-direction:column;gap:7px"></div>
    </div>
    <div class="card">
      <div class="card-title"><i class="ti ti-circle-check" style="color:${curAcc}"></i> Recuento del día</div>
      <div>
        <div class="recuento-row"><span>Completadas</span><span style="font-weight:700;color:${curAcc}">${done}/${total}</span></div>
        <div class="recuento-row"><span>Tiempo trabajado</span><span style="font-weight:700;color:#FE9D18">${(doneMins/60).toFixed(1)} h</span></div>
        <div class="recuento-row"><span>Grupo top</span><span style="font-weight:700;color:#23DBCD">${topGroup}</span></div>
        <div class="recuento-row"><span>Racha activa</span><span style="font-weight:700;color:#ED0C7D">${streak} días</span></div>
        ${history.length>0?`<div class="recuento-row"><span>vs ayer</span><span style="font-weight:700;color:${pct-(Number(history[history.length-1]?.pct)||0)>=0?'#00897C':'#ED0C7D'}">${pct-(Number(history[history.length-1]?.pct)||0)>=0?'⬆':'⬇'} ${Math.abs(pct-(Number(history[history.length-1]?.pct)||0))}%</span></div>`:''}
      </div>
    </div>
    <div class="card">
      <div class="card-title"><i class="ti ti-calendar-week" style="color:#FE9D18"></i> Historial</div>
      <div id="history-list"></div>
    </div>
  </div>`;

  document.getElementById('dashboard-content').innerHTML=html;

  // Top tasks
  var sorted=[...tasks].sort((a,b)=>b.mins-a.mins).slice(0,3);
  document.getElementById('top-tasks').innerHTML=sorted.map(t=>`
    <div style="display:flex;align-items:center;gap:8px;font-size:12px">
      <div class="p-bar-bg" style="flex:1"><div class="p-bar" style="width:${Math.round(t.mins/sorted[0].mins*100)}%;background:${catColors[t.cat]||curAcc}"></div></div>
      <span style="font-size:11px;min-width:55px;text-align:right">${t.name.slice(0,10)}… ${t.mins}m</span>
    </div>`).join('');

  // Historial
  document.getElementById('history-list').innerHTML=history.slice(-5).reverse().map(h=>{
    var p=Number(h.pct)||0;
    return `<div class="history-row">
      <span class="history-date">${h.day||''} ${String(h.date).slice(5,10)}</span>
      <div class="p-bar-bg" style="flex:1"><div class="p-bar" style="width:${p}%;background:${p>=80?'#00897C':p>=50?'#FE9D18':'#ED0C7D'}"></div></div>
      <span class="history-pct" style="color:${p>=80?'#00897C':p>=50?'#FE9D18':'#ED0C7D'}">${p}%</span>
    </div>`;
  }).join('');

  buildCharts(tasks, history, groupMins);
  pomDisplay();
}

function toggleTask(idx){
  if(!dashData||!dashData.tasks) return;
  var t=dashData.tasks[idx];
  t.done=!t.done;
  renderDashboard(dashData);
  updateTask(t.name, t.done);
  showToast(t.done?'✅ '+t.name+' completada':'↩️ '+t.name+' pendiente');
}

function buildCharts(tasks, history, groupMins){
  var tc='#aaa';
  var baseOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#fff',titleColor:'#333',bodyColor:'#666',borderColor:'#eee',borderWidth:1}},scales:{x:{ticks:{color:tc,font:{size:10}},grid:{display:false}},y:{ticks:{color:tc,font:{size:10}},grid:{color:'rgba(200,200,200,.2)'}}}};
  if(chart0)chart0.destroy();
  chart0=new Chart(document.getElementById('chart0').getContext('2d'),{type:'bar',data:{labels:tasks.map(t=>t.name.length>12?t.name.slice(0,12)+'…':t.name),datasets:[{data:tasks.map(t=>t.mins),backgroundColor:tasks.map(t=>t.done?curAcc:(catBg[t.cat]||'#FFE3F4')),borderRadius:5,borderSkipped:false}]},options:{...baseOpts,plugins:{...baseOpts.plugins,tooltip:{...baseOpts.plugins.tooltip,callbacks:{label:c=>c.parsed.y+' min'}}}}});
  if(chart1)chart1.destroy();
  var ck=Object.keys(groupMins),cv=ck.map(k=>groupMins[k]),cc=ck.map(k=>catColors[k]||'#FE9BD4');
  chart1=new Chart(document.getElementById('chart1').getContext('2d'),{type:'doughnut',data:{labels:ck,datasets:[{data:cv,backgroundColor:cc,borderWidth:2,borderColor:'#fff',hoverOffset:7}]},options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.label+': '+c.parsed+' min'}}}}});
  document.getElementById('donut-legend').innerHTML=ck.map((k,i)=>`<div class="legend-item"><div class="legend-dot" style="background:${cc[i]}"></div>${k}: ${cv[i]} min</div>`).join('');
  if(chart2)chart2.destroy();
  var days=history.slice(-7);
  chart2=new Chart(document.getElementById('chart2').getContext('2d'),{type:'bar',data:{labels:days.map(h=>h.day||''),datasets:[{label:'Completadas',data:days.map(h=>h.done||0),backgroundColor:curAcc,borderRadius:4,borderSkipped:false},{label:'Pendientes',data:days.map(h=>(h.total||0)-(h.done||0)),backgroundColor:'#FFE3F4',borderRadius:4,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,labels:{color:tc,font:{size:10},boxWidth:9,padding:10}},tooltip:{mode:'index',intersect:false}},scales:{x:{stacked:true,ticks:{color:tc,font:{size:10}},grid:{display:false}},y:{stacked:true,ticks:{color:tc,font:{size:10},stepSize:2},grid:{color:'rgba(200,200,200,.2)'}}}}});
}

function switchTab(i){document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',i===j));for(var k=0;k<3;k++)document.getElementById('cp'+k).style.display=k===i?'block':'none';}

function openNewDay(){
  if(!dashData) return;
  var tasks=dashData.tasks||[];
  var done=tasks.filter(t=>t.done).length,total=tasks.length,pct=total?Math.round(done/total*100):0;
  var dm=tasks.filter(t=>t.done).reduce((a,t)=>a+(t.mins||0),0);
  var days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  var today=new Date();
  var entry={date:today.toISOString().slice(0,10),day:days[today.getDay()],done,total,pct,mins:dm};
  saveHistoryToSheets(entry);
  var mi=document.getElementById('modal-inner');
  mi.innerHTML=`<h3 style="color:#ED0C7D;text-align:center;margin-bottom:.5rem">🌅 Resumen de hoy</h3>
    <div class="summary-grid">
      <div class="summary-box"><div class="val">${done}</div><div class="lbl">completadas</div></div>
      <div class="summary-box"><div class="val">${pct}%</div><div class="lbl">productividad</div></div>
      <div class="summary-box"><div class="val">${(dm/60).toFixed(1)}h</div><div class="lbl">trabajadas</div></div>
    </div>
    <p style="font-size:12px;color:#aaa;text-align:center;margin-bottom:1rem">¿Resetear para el nuevo día?</p>
    <div style="display:flex;gap:8px;justify-content:center">
      <button onclick="closeModal()" style="padding:8px 18px;border-radius:8px;border:1px solid #ddd;background:transparent;color:#888;cursor:pointer">Cancelar</button>
      <button onclick="confirmNewDay()" style="padding:8px 18px;border-radius:8px;border:none;background:#ED0C7D;color:#fff;font-weight:600;cursor:pointer">Sí, nuevo día 🌸</button>
    </div>`;
  document.getElementById('modal-bg').classList.add('open');
}

function confirmNewDay(){
  if(!dashData) return;
  dashData.tasks.forEach(t=>t.done=false);
  closeModal();
  renderDashboard(dashData);
  showToast('🌸 ¡Nuevo día, nueva energía!');
}

function closeModal(e){if(!e||e.target===document.getElementById('modal-bg'))document.getElementById('modal-bg').classList.remove('open');}

function pomDisplay(){
  var el=document.getElementById('pom-display');if(!el)return;
  var m=Math.floor(pomSec/60),s=pomSec%60;
  el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  var arc=document.getElementById('pom-arc');if(!arc)return;
  arc.style.strokeDashoffset=circ*(1-pomSec/((pomIsWork?pomWork:pomBreak)*60));
}
function pomTick(){
  if(pomSec>0){pomSec--;pomDisplay();}
  else{
    pomRunning=false;clearInterval(pomInterval);pomInterval=null;
    var btn=document.getElementById('pom-btn');if(btn)btn.textContent='▶ Iniciar';
    if(pomIsWork){pomIsWork=false;pomSec=pomBreak*60;var b=document.getElementById('pom-badge');if(b){b.textContent='Descanso';b.style.background='#B7EDE4';b.style.color='#005048';}}
    else{pomIsWork=true;pomCurSess=Math.min(pomCurSess+1,pomSessions);pomSec=pomWork*60;var b2=document.getElementById('pom-badge');if(b2){b2.textContent='Trabajo';b2.style.background='#FFE3F4';b2.style.color='#A3005A';}}
    var s=document.getElementById('pom-sess');if(s)s.textContent='Sesión '+pomCurSess+' de '+pomSessions;
    pomDisplay();
  }
}
function pomToggle(){
  if(pomRunning){clearInterval(pomInterval);pomInterval=null;pomRunning=false;var b=document.getElementById('pom-btn');if(b)b.textContent='▶ Continuar';}
  else{pomRunning=true;pomInterval=setInterval(pomTick,1000);var b=document.getElementById('pom-btn');if(b)b.textContent='⏸ Pausar';}
}
function pomReset(){
  clearInterval(pomInterval);pomInterval=null;pomRunning=false;pomSec=pomWork*60;pomCurSess=1;pomIsWork=true;
  var b=document.getElementById('pom-btn');if(b)b.textContent='▶ Iniciar';
  var badge=document.getElementById('pom-badge');if(badge){badge.textContent='Trabajo';badge.style.background='#FFE3F4';badge.style.color='#A3005A';}
  var s=document.getElementById('pom-sess');if(s)s.textContent='Sesión 1 de '+pomSessions;
  pomDisplay();
}

var savedPal=localStorage.getItem('db_pal');
if(savedPal)applyPal(parseInt(savedPal));
initHeader();
loadData();
setInterval(initHeader,60000);
setInterval(loadData,300000);
</script>
</body>
</html>
